spring:
  application:
    name: FeatureFlagLite-Test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=60s

logging:
  level:
    root: WARN
